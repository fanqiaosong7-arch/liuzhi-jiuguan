<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>柳枝酒馆 · Willow Tavern</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 像素画面 -->
  <canvas id="game"></canvas>

  <!-- HUD 顶栏 -->
  <div id="hud">
    <div class="hud-left">
      <span id="hud-wallet" class="hud-chip" title="钱包（余额/流水）">💰 <b id="hud-money">$5.00</b></span>
      <span id="hud-clock" class="hud-chip" title="日历"></span>
      <span id="hud-scene" class="hud-tag">二楼房间</span>
      <span id="hud-diff" class="hud-tag" title="酒馆难度">难度 标准</span>
    </div>
    <div class="hud-right">
      <button id="btn-ledger" class="pix-btn small" title="商人的账册（战绩/流水）">账册</button>
      <button id="btn-quit" class="pix-btn small danger" title="退出酒馆">退出</button>
    </div>
  </div>

  <!-- 底部操作提示 -->
  <div id="hint">WASD/方向键 移动 ｜ E/回车 交互 ｜ Esc 菜单</div>

  <!-- 覆盖层（对话框/面板/游戏界面） -->
  <div id="overlay"></div>

  <!-- 文字冒险风格底部文本框（2026-08-18） -->
  <div id="speech-box" style="display:none">
    <div class="speech-frame">
      <div class="speech-body">
        <div class="speech-portrait" id="speech-portrait"><canvas id="speech-canvas"></canvas></div>
        <div class="speech-text">
          <div class="speech-name" id="speech-name"></div>
          <div class="speech-content" id="speech-content"></div>
        </div>
      </div>
      <div class="speech-actions" id="speech-actions"></div>
    </div>
  </div>

  <!-- 移动端触摸控制（仅触屏设备显示；覆盖层打开时自动隐藏） -->
  <div id="touch" aria-hidden="true">
    <div id="touch-dpad">
      <button class="tbtn" data-key="w" aria-label="上">▲</button>
      <button class="tbtn" data-key="a" aria-label="左">◀</button>
      <button class="tbtn" data-key="s" aria-label="下">▼</button>
      <button class="tbtn" data-key="d" aria-label="右">▶</button>
    </div>
    <div id="touch-actions">
      <button class="tbtn interact" id="t-interact" aria-label="交互">✋<span>交互</span></button>
      <button class="tbtn menu" id="t-menu" aria-label="菜单">☰<span>菜单</span></button>
    </div>
  </div>

  <!-- 脚本：纯原生 JS，无任何依赖（顺序加载，共享全局命名空间） -->
  <script src="js/global.js"></script>
  <script src="js/rules-cards.js"></script>
  <script src="js/rules-blackjack.js"></script>
  <script src="js/rules-poker.js"></script>
  <script src="js/rules-doudizhu.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/lpc_data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/changelog.js"></script>
  <script src="js/game-blackjack.js"></script>
  <script src="js/game-poker.js"></script>
  <script src="js/game-doudizhu.js"></script>
  <script src="js/game-uno.js"></script>
  <script src="js/game-snake.js"></script>
  <script src="js/game-pong.js"></script>
  <script src="js/main.js"></script>
  <script src="js/touch.js"></script>
</body>
</html>
